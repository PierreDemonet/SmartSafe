[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pv-platform"
version = "0.1.0"
description = "PV engineering platform with automated layout and RTX shading"
authors = [{name = "SmartSafe"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pydantic>=2",
    "geopandas",
    "shapely",
    "pyproj",
    "pvlib",
    "typer",
    "matplotlib",
    "ezdxf",
    "openpyxl",
    "pyyaml",
    "trimesh",
    "pytest"
]

[project.scripts]
pvai = "pvai.cli:app"
